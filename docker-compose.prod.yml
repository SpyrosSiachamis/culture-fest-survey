# Production stack. Use this file, not docker-compose.yml, in production:
#
#   docker compose -f docker-compose.prod.yml up -d --build
#
# It is a standalone file rather than an overlay on the dev compose, because the important
# differences are things an overlay cannot express — the dev file's phpMyAdmin service and its
# published database port have to be *absent*, and an overlay can only add or override services,
# never remove them.
#
# What this hardens relative to the dev stack:
#   * no phpMyAdmin — the database admin UI is never exposed in production;
#   * the database publishes no host port — it is reachable only by the backend over the internal
#     network, never from outside the host;
#   * the app ports bind to 127.0.0.1 only, so nothing is served directly on a public interface;
#     a TLS reverse proxy (Caddy, or `tailscale serve`) is expected to front them;
#   * production servers — uvicorn without --reload, `next start` on a real build — and no source
#     bind mounts, so the running code is the built image;
#   * AUTH_COOKIE_SECURE is forced true, so a session cookie is never issued over plain HTTP.
#
# Before deploying, set in backend/.env:
#   * strong SECRET_KEY / PEPPER / DB_PASSWORD / MYSQL_* (openssl rand -hex 32 for the first two);
#   * ALLOWED_ORIGINS to the real public origin(s), with no trailing slash on any of them — a
#     browser's Origin header never has one, so "https://example.com/" would never match.
#
# AUTH_COOKIE_SECURE, AUTH_COOKIE_SAMESITE and TRUSTED_PROXY_IPS are set below rather than in
# backend/.env, because that file is shared with the dev stack and each of these would break it.

services:
    backend:
        build:
            context: ./backend
            dockerfile: Dockerfile
        image: culture-fest-backend:prod
        restart: always
        depends_on:
            culture-fest-mysql:
                condition: service_healthy
        # 127.0.0.1 only: the reverse proxy (same host) forwards to it; it is never on a public
        # interface itself.
        ports:
            - '127.0.0.1:${BACKEND_PORT:-5000}:5000'
        env_file:
            - backend/.env
        environment:
            # Guardrail, not a default to be overridden: a production session cookie must carry the
            # Secure attribute, so it is never sent (or stored) over plain HTTP. TLS is terminated by
            # the fronting proxy.
            AUTH_COOKIE_SECURE: 'true'
            # Explicit, though it matches the default, because it is the setting most likely to be
            # "fixed" by someone debugging a session problem — and changing it here would quietly
            # give up the app's CSRF defence.
            #
            # "lax" is correct because culturefest.gr and api.culturefest.gr are the same *site*:
            # SameSite is judged on the registrable domain (culturefest.gr — .gr is the public
            # suffix), not on the origin, so a subdomain split is same-site and the cookie is sent
            # on the frontend's API calls exactly as it is in dev. They are still different
            # *origins*, which is why ALLOWED_ORIGINS below is still required.
            #
            # It would only need to become "none" if the frontend moved to a genuinely different
            # domain (a *.vercel.app URL, say). That also requires Secure — src/auth.py refuses to
            # start if the two disagree — and would leave this API relying on the JSON content-type
            # preflight alone to block cross-site writes.
            AUTH_COOKIE_SAMESITE: 'lax'
            # Production origins only. Overrides the value in backend/.env, which is shared with the
            # dev stack and lists localhost and tailnet origins — those are credentialed origins, so
            # carrying them into production would let a page on a developer's own machine make
            # authenticated calls against the live API.
            #
            # The apex and www are both listed because the browser sends whichever origin the page
            # was actually loaded from; drop www if it redirects to the apex before any API call is
            # made. No trailing slashes — an Origin header never has one.
            ALLOWED_ORIGINS: 'https://culturefest.gr,https://www.culturefest.gr'
            # Restores the real client IP from X-Forwarded-For, without which every request appears
            # to come from the proxy and the whole userbase shares one rate-limit bucket — so a
            # single abuser would trip the login/verify/submit limits for everybody.
            #
            # This must be the address the *container* sees the proxy as, which is not the address
            # the proxy runs on: the backend is published on 127.0.0.1 and reached over Docker's
            # bridge, so a connection from a host-side proxy arrives from the bridge gateway
            # (172.x.0.1), never from 127.0.0.1. The gateway of a compose-created network is
            # allocated dynamically, so this trusts the private range those gateways come from
            # rather than a fixed address that would break the next time the network is recreated.
            #
            # Safe because nothing outside this host can open a connection to the container at all
            # (the published port binds 127.0.0.1 only), so the only peers in this range are the
            # proxy and the other services on app-network. Never widen it to "*" — that would trust
            # X-Forwarded-For from any caller and hand every client a spoofable rate-limit key.
            TRUSTED_PROXY_IPS: '172.16.0.0/12'
        # No --reload, no source mount: the image's baked code and CMD run as-is.
        networks:
            - app-network

    frontend:
        build:
            context: ./frontend
            dockerfile: Dockerfile.prod
            args:
                # Inlined into the browser bundle at build time — must be the API URL as reached
                # from the visitor's browser. Mirror it from the environment so it is set in one
                # place; see frontend/.env.example.
                NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        image: culture-fest-frontend:prod
        restart: always
        ports:
            - '127.0.0.1:${FRONTEND_PORT:-3000}:3000'
        depends_on:
            - backend
        networks:
            - app-network

    culture-fest-mysql:
        image: mysql:8.0
        container_name: culture-fest-mysql-prod
        restart: always
        environment:
            MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
            MYSQL_DATABASE: ${MYSQL_DATABASE}
            MYSQL_USER: ${MYSQL_USER}
            MYSQL_PASSWORD: ${MYSQL_PASSWORD}
        # Deliberately no `ports:` — the database is reachable only by the backend over app-network.
        # Nothing outside the compose network can connect to it.
        volumes:
            - mysql_data_prod:/var/lib/mysql
        networks:
            - app-network
        healthcheck:
            test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}" ]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 30s

    # No phpMyAdmin service in production, on purpose.

volumes:
    mysql_data_prod:

networks:
    app-network:
        driver: bridge
