services:
    backend:
        build:
            context: ./backend
            dockerfile: Dockerfile
        container_name: culture-fest-backend
        depends_on:
            culture-fest-mysql:
                condition: service_healthy
        ports:
            - '${BACKEND_PORT}:5000'
        env_file:
            - ./backend/.env
        volumes:
            - ./backend:/app
        command: python -m uvicorn src.app:app --host 0.0.0.0 --port 5000 --reload
        networks:
            - app-network

    frontend:
        build:
            context: ./frontend
            dockerfile: Dockerfile
        container_name: culture-fest-survey-frontend
        ports:
        - '${FRONTEND_PORT}:3000'
        env_file:
            - ./frontend/.env
        volumes:
            - ./frontend:/app
            - /app/node_modules
        command: npm run dev
        networks:
            - app-network
    culture-fest-mysql:
        image: mysql:8.0
        container_name: culture-fest-mysql
        restart: always
        environment:
            MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
            MYSQL_DATABASE: ${MYSQL_DATABASE}
            MYSQL_USER: ${MYSQL_USER}
            MYSQL_PASSWORD: ${MYSQL_PASSWORD}
        ports:
            - '${MYSQL_PORT}:3306'
        volumes:
            - mysql_data:/var/lib/mysql
        networks:
            - app-network
        healthcheck:
            test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}" ]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 30s

    phpmyadmin:
        image: phpmyadmin/phpmyadmin
        container_name: phpmyadmin
        environment:
            PMA_HOST: culture-fest-mysql
            MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
        ports:
        - "${PHPMYADMIN_PORT}:80"
        depends_on:
            culture-fest-mysql:
                condition: service_healthy
        networks:
        - app-network

volumes:
    mysql_data:

networks:
    app-network:
        driver: bridge
